schema_version: "1.0"

preset:
  id: "coding-harness"
  name: "Coding-Harness Workflow"
  version: "1.0.0"
  description: "Enforces Coding-Harness specification, layering, test-first, and verification rules."

requires:
  speckit_version: ">=1.0.4,<2.0.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Adds Coding-Harness specification ownership and language rules."
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Adds Coding-Harness architecture and validation planning gates."
      strategy: "append"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Makes Gherkin and executable tests mandatory in generated tasks."
      strategy: "append"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Checks generated artifacts against repository governance."
      strategy: "append"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Blocks implementation until the Coding-Harness preflight is complete."
      strategy: "prepend"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Adds Coding-Harness completion and verification checks."
      strategy: "append"

tags:
  - "coding-harness"
  - "test-first"
  - "governance"
