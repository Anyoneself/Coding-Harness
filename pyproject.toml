[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent"
version = "0.1.0"
description = "Production-grade layered AI agent with controlled tools and a Web console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langgraph>=0.2.0",
  "openai>=1.55.0",
  "python-dotenv>=1.0.1",
  "tavily-python>=0.5.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "ruff>=0.12.0",
]

[project.scripts]
my-agent = "application.cli:main"
my-agent-demo = "examples.production_agent_demo:main"

[tool.setuptools.packages.find]
include = ["application*", "examples"]

[tool.setuptools.package-data]
application = ["static/*"]

[tool.ruff]
exclude = ["examples/legacy"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP"]
