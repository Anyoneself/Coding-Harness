# 保留原 Compose 项目标识，使项目改名后仍能接管既有容器、网络和数据卷。
name: my-agent

services:
  postgres:
    container_name: my-agent-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_agent}
      POSTGRES_USER: ${POSTGRES_USER:-my_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

networks:
  default:
    name: my-agent
